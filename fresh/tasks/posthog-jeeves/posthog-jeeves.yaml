task_id: posthog-jeeves
domain: fresh
difficulty: medium
description: 'Implement a Python repository compatible with the documented public
  interface of PostHog/jeeves. The repository must provide importable module `inference.api`
  at `inference/api.py` and expose the declared public names: parse_options, parse_question,
  parse_request, r2, choice_confidence, score_confidence, answer, response, MAX_OPTIONS,
  MODEL_ID. Imports must be deterministic, unknown attributes must raise AttributeError,
  and public callables must support Python signature introspection. No network service
  may be required by these tested behaviors. Parse the documented Jev request shape,
  preserve question order, produce exact answer dictionaries, and reject missing state,
  empty questions, empty choice criteria, and unknown options.'
api_contract: 'PUBLIC SURFACE (no implementation bodies)

  Import: import inference.api

  Required path: inference/api.py

  - function parse_options(raw, defaults)

  - function parse_question(qid, raw)

  - function parse_request(body, defaults)

  - function r2(x)

  - function choice_confidence(p)

  - function score_confidence(p)

  - function answer(q, p)

  - function response(record, model, opts, results, tok, latency_ms)

  - constant MAX_OPTIONS = 255

  - constant MODEL_ID = ''jeeves-latest''

  '
