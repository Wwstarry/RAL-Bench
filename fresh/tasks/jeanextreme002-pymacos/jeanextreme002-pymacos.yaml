description: 'Implement a Python repository compatible with the documented public
  interface of JeanExtreme002/pymacos. The repository must provide importable module
  `macos` at `macos/__init__.py` and expose the declared public names: appearance,
  apps, audio, auth, bluetooth, browser, camera, clipboard, defaults, dialog, dock,
  document, events, finder, hotkeys, image. Imports must be deterministic, unknown
  attributes must raise AttributeError, and public callables must support Python signature
  introspection. `macos.image.ImageInfo(width, height, format, has_alpha, orientation,
  dpi)` is a frozen value object with value equality. No network service or macOS
  host operation may be required by these tested behaviors.'
