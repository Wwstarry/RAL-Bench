description: 'Implement ToolReplay''s documented hash-chain semantics: seal ordered
  transcript records from a zero genesis digest, chain each previous digest, emit
  canonical compact JSONL, verify intact chains, and identify the first record changed
  after sealing.'
api_contract: 'PUBLIC SURFACE (no implementation bodies)

  Import: import toolreplay.chain

  Required path: src/toolreplay/chain.py

  - class Link

  - function seal(records)

  - class VerifyResult

  - function verify(links)

  - function links_to_jsonl(links)

  - function load_sealed(path)


  Semantic cases: a two-record seal has prev=''0''*64 then prev equal to the prior
  digest and verifies intact; JSONL has sorted compact objects and a trailing newline;
  changing response data makes verify return broken_index 0 with differing expected/found
  digests.

  '
