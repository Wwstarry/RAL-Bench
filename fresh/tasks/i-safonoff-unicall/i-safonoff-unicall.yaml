description: 'Implement a Python repository compatible with the documented public
  interface of i-safonoff/unicall. The repository must provide importable module `unicall`
  at `src/unicall/__init__.py` and expose the declared public names: CoalescedFunction,
  Coalescer, UnhashableArgumentsError, unicall, Backend, DistributedCoalescer, JSONSerializer,
  RemoteFlightError, Serializer, UnserializableResultError, distributed, Metrics,
  Stats, stable_hash. Imports must be deterministic, unknown attributes must raise
  AttributeError, and public callables must support Python signature introspection.
  Concurrent same-key calls coalesce into one execution and share its result; completed
  flights are evicted, and unhashable arguments raise UnhashableArgumentsError.'
