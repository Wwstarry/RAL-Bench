description: 'Implement a Python repository compatible with the documented public
  interface of SpireflyHQ/pyxaf. The repository must provide importable module `pyxaf`
  at `src/pyxaf/__init__.py` and expose the declared public names: annotations, PackageNotFoundError,
  detect, EncryptedAuditfileError, ForbiddenConstructError, LimitExceededError, MissingExtraError,
  NotAnAuditfileError, PyxafError, XmlSyntaxError, CODES, Finding, Severity, Family,
  FormatInfo, NamespaceStatus. Imports must be deterministic, unknown attributes must
  raise AttributeError, and public callables must support Python signature introspection.
  Detect the official XAF 4.0 namespace exactly and deterministically; reject DOCTYPE/entity
  input and truncated XML with the documented exception types.'
