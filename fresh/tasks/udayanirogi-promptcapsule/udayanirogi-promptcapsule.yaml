description: 'Implement a Python repository compatible with the documented public
  interface of UdayaNirogi/promptcapsule. The repository must provide importable module
  `promptcapsule` at `promptcapsule/__init__.py` and expose the declared public names:
  GitHubGistBackend, InMemoryBackend, S3Backend, SQLiteBackend, CapsuleResult, PromptCapsule,
  FormatError, IntegrityError, PromptCapsuleError, SignatureError, SizeLimitError,
  VaultError, IntegrityChecker, default_vault_path, pack, unpack. Imports must be
  deterministic, unknown attributes must raise AttributeError, and public callables
  must support Python signature introspection. No network service may be required
  by these tested behaviors. `unpack(pack(text))` returns the exact Unicode text;
  corruption raises PromptCapsuleError, and a wrong verification key raises SignatureError.'
