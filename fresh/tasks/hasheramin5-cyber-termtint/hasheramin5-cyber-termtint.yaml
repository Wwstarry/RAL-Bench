  interface of hasheramin5-cyber/TermTint. The repository must provide importable
  module `termtint` at `src/termtint/__init__.py` and expose the declared public names:
  colored, disable_color, enable_color, is_color_enabled, print_256, print_black,
  print_blue, print_cyan, print_green, print_magenta, print_red, print_rgb, print_white,
