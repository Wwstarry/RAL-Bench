task_id: nousergon-evidence-review
domain: fresh
difficulty: medium
description: 'Implement the retained, cross-platform measured-badge boundary for Evidence
  Review: emit deterministic coverage/license/Python badge payloads only after reproducible
  clean-install verification and reject absent coverage. The main evidence_review
  runtime is documented for macOS/Linux and is not treated as executable on this Windows
  reference host.'
api_contract: 'PUBLIC SURFACE (no implementation bodies)

  Import: import badges

  Required path: scripts/badges.py

  - function payloads(coverage, package)

  - function main()


  Semantic cases: payloads rounds measured Python coverage to two decimals, selects
  brightgreen at >=90%, and carries sourceSha into every badge; incomplete package
  verification or zero measured statements raises ValueError. Scope limitation: this
  task validates the public CI badge boundary, not the POSIX-only browser runtime.

  '
