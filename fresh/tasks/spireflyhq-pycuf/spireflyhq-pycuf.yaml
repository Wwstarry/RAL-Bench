difficulty: medium
description: 'Implement a Python repository compatible with the documented public
  interface of SpireflyHQ/pycuf. The repository must provide importable module `pycuf`
  at `src/pycuf/__init__.py` and expose the declared public names: annotations, PackageNotFoundError,
  policy, Totals, ForbiddenConstructError, LimitExceededError, MissingExtraError,
  NotCufError, PycufError, XmlSyntaxError, CODES, Finding, Severity, Bundle, Costs,
  CostType, read. Imports must be deterministic, unknown attributes must raise AttributeError,
  and public callables must support Python signature introspection. No network service
  may be required by these tested behaviors. For the documented toy CUF, a zero quantity
  factor totals 500 under usage rules and 0 under schema rules. Invalid policies and
  malformed XML are rejected.'
api_contract: 'PUBLIC SURFACE (no implementation bodies)

  Import: import pycuf

  Required path: src/pycuf/__init__.py

  - object annotations

