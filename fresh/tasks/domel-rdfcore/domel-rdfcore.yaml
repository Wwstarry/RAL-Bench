task_id: domel-rdfcore
domain: fresh
difficulty: medium
description: 'Implement a Python repository compatible with the documented public
  interface of domel/RDFCore. The repository must provide importable module `rdfcore`
  at `rdfcore/__init__.py` and expose the declared public names: BadSyntax, CompValueException,
  Error, ModificationException, ObjectTypeError, ParserError, PluginException, StoreException,
  UniquenessError, BNode, Identifier, IdentifiedNode, Literal, Node, TripleTerm, URIRef.
  Imports must be deterministic, unknown attributes must raise AttributeError, and
  public callables must support Python signature introspection. Also expose Graph:
  adding the same triple is idempotent, objects query it, and N-Triples serialization
  round-trips; malformed Turtle and unknown serializers must fail.'
api_contract: 'PUBLIC SURFACE (no implementation bodies)

  Import: import rdfcore

  Required path: rdfcore/__init__.py

  - object BadSyntax

  - object CompValueException

  - object Error

  - object ModificationException

  - object ObjectTypeError

  - object ParserError

  - object PluginException

  - object StoreException

  - object UniquenessError

  - object BNode

  - object Identifier

  - object IdentifiedNode

  - object Literal

  - object Node

  - object TripleTerm

  - object URIRef

  - class Graph

  '
