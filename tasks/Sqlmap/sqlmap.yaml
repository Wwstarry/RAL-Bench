domain: security
difficulty: medium
description: 'Implement a pure Python CLI-driven SQL injection testing tool that is interface-compatible
  with the core entrypoint and module layout of the reference sqlmap project under ./repositories/sqlmap.
  The generated repository must:


  - Provide a runnable CLI entrypoint at repo root: "sqlmap.py", executable via `python sqlmap.py ...`.


  - Preserve the key internal/public API surface used by the test suite, including at least:

  * Command-line parsing:

  - lib.parse.cmdline.cmdLineParser


  * Options initialization:

  - lib.core.option.init

  - lib.core.option.initOptions


  * Core shared runtime state referenced by the CLI entrypoint:

  - lib.core.data: cmdLineOptions, conf, kb


  * Core settings/metadata constants:

  - lib.core.settings: VERSION, DESCRIPTION (or equivalent string metadata)


  * Controller entry point:

  - lib.controller.controller.start


  - Support benign CLI invocations used by tests without requiring any external target:

  - `python sqlmap.py -h` (basic help)

  - `python sqlmap.py -hh` (advanced help)

  - `python sqlmap.py --version` (version output)


  - Handle invalid or nonsensical arguments robustly (exit cleanly, no crash/hang), and produce an informative
  error/help message.


  - Behave so the same black-box tests run successfully on the generated repo, including exact module
  paths, symbol names, and observable CLI behaviour.

  '
