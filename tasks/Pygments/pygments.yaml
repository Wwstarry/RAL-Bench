task_id: pygments
domain: lib
difficulty: medium
description: "Implement a pure-Python syntax highlighting library that is API-compatible with the core\
  \ parts of the reference Pygments project. The generated repository must:\n\n- Match the directory and\
  \ package structure expected by the test suite, including:\n    * pygments.lexers\n    * pygments.formatters\n\
  \    * pygments.styles\n    * pygments.token\n    * pygments.util\n    * pygments.filters\n\n- Provide\
  \ a functioning lexing pipeline via pygments.lex that returns a token stream over source code.\n- Implement\
  \ highlight(code, lexer, formatter) that connects lexing to formatting.\n- Implement a minimal but API-compatible\
  \ PythonLexer, JsonLexer, IniLexer and a generic get_lexer_by_name interface.\n- Implement an HtmlFormatter\
  \ capable of generating HTML output and style definitions.\n- Implement a TerminalFormatter that can\
  \ optionally emit ANSI-colored output.\n\n- Behave consistently enough with the reference implementation\
  \ to allow the same black-box tests used for the reference repository to succeed on the generated implementation.\n"
